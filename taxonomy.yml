# Format taxonomy - display order + labels for the gallery and README.
# Topic / style / tool values grow freely inside each work's meta.yml.
# FORMAT = the structural artifact type. STYLE = the visual treatment (lives in meta.yml).
formats:
  infographic:
    label: Infographic
    blurb: A complex data/AI concept, explained in one image.
  chart:
    label: Chart
    blurb: One chart, one idea - single-chart experiments, d3.js spirit. Never a dashboard.
  data-portrait:
    label: Data portrait
    blurb: One number or stat as the hero - the two-second rule made visible.
  diagram:
    label: Diagram
    blurb: A system, pipeline, or architecture drawn as designed art, not a boxes-and-arrows dump.
  timeline:
    label: Timeline
    blurb: How a concept, tech, or idea evolved - time as the spine.
  map:
    label: Map
    blurb: A concept as territory - a landscape or transit-map of an idea space.
  matrix:
    label: Matrix
    blurb: A 2x2 or quadrant framework - a decision or trade-off made spatial.
  isotype:
    label: Isotype
    blurb: Quantity shown by repeating identical pictograms - more units, never a bigger icon.
  annotated:
    label: Annotated
    blurb: A chart, screenshot, or artifact with labels pointing straight at the meaning.
  field-guide:
    label: Field guide
    blurb: A naturalist plate cataloguing the "species" of a data/AI thing.
  comic:
    label: Comic
    blurb: Strips that teach a real lesson.
  poster:
    label: Poster
    blurb: One bold visual metaphor for a data/AI idea.
  typographic:
    label: Typographic
    blurb: Type IS the image - words as the whole composition.
  carousel:
    label: Carousel
    blurb: Multi-slide explainers for concepts that need pacing.
  zine:
    label: Zine
    blurb: An editorial spread or mini-page - print-craft applied to one idea.
  card:
    label: Card
    blurb: A compact shareable image with one sharp idea.
  cheatsheet:
    label: Cheatsheet
    blurb: One page, 80% of what matters - a topic distilled and designed to keep.
  ironic-graph:
    label: Ironic graph
    blurb: Charts that tell the truth by exaggerating it.
  illustration:
    label: Illustration
    blurb: Data and AI ideas as scenes and characters.
  logo:
    label: Logo
    blurb: Marks and identity for data/AI things.
  style-study:
    label: Style study
    blurb: The sketchbook - mimicking a beautiful style to learn it.
  website:
    label: Website
    blurb: A full web page or site design.
    scope: studio
  app-ui:
    label: App UI
    blurb: Application or product interface screens.
    scope: studio
  deck:
    label: Deck
    blurb: Slide or presentation design.
    scope: studio
  identity:
    label: Identity
    blurb: Logo and brand identity systems.
    scope: studio
  packaging:
    label: Packaging
    blurb: Physical product and package design.
    scope: studio
  motion:
    label: Motion
    blurb: Animation and motion design.
    scope: studio

# CATEGORY = the visual discipline/genre a style belongs to (MECE list, added 2026-09-02).
# Multi-tag like a Notion db: a style card carries EVERY category it genuinely serves
# (comic + storybook, ui-web + infographic, etc). Cards store it as `category: [a, b]`.
# One vocabulary, one home - this file. Do not fork or restate the list anywhere.
categories:
  data-viz:
    label: Data viz
    blurb: Charts, graphs, data maps - marks driven by values.
  infographic:
    label: Infographic
    blurb: Composite explanatory graphics - data + illustration + hand-set text.
  illustration:
    label: Illustration
    blurb: Single-image drawn or painted work - editorial, decorative, concept.
  storybook:
    label: Storybook
    blurb: Narrative picture-book illustration - characters, scenes, warmth.
  comic:
    label: Comic
    blurb: Sequential panel storytelling - strips, zines, graphic novels.
  typography:
    label: Typography
    blurb: Type as the image - lettering, typographic composition.
  graphic-design:
    label: Graphic design
    blurb: Poster, print, editorial layout craft - grids, composition systems.
  branding:
    label: Branding
    blurb: Logos, marks, identity systems.
  ui-web:
    label: UI / Web
    blurb: Website, app, and product interface design.
  photography:
    label: Photography
    blurb: Photographic and photo-art registers - lens, light, grade.
  motion:
    label: Motion
    blurb: Animation, motion graphics, video grade.
  three-d:
    label: 3D / Spatial
    blurb: 3D render, sculpture, installation, architecture.
  craft-material:
    label: Craft / Material
    blurb: Physical media - paper cut, textile, clay, collage, assemblage.
  fine-art:
    label: Fine art
    blurb: Painting and drawing traditions as the register - ink, oil, charcoal, printmaking.
