# Format taxonomy - display order + labels for the gallery and README.
# Topic / style / tool values grow freely inside each work's meta.yml.
# FORMAT = the structural artifact type. STYLE = the visual treatment (lives in meta.yml).
formats:
  infographic:
    label: Infographic
    blurb: A complex data/AI concept, explained in one image.
  chart:
    label: Chart
    blurb: One chart, one idea - single-chart experiments, d3.js spirit. Never a dashboard.
  data-portrait:
    label: Data portrait
    blurb: One number or stat as the hero - the two-second rule made visible.
  diagram:
    label: Diagram
    blurb: A system, pipeline, or architecture drawn as designed art, not a boxes-and-arrows dump.
  timeline:
    label: Timeline
    blurb: How a concept, tech, or idea evolved - time as the spine.
  map:
    label: Map
    blurb: A concept as territory - a landscape or transit-map of an idea space.
  matrix:
    label: Matrix
    blurb: A 2x2 or quadrant framework - a decision or trade-off made spatial.
  isotype:
    label: Isotype
    blurb: Quantity shown by repeating identical pictograms - more units, never a bigger icon.
  annotated:
    label: Annotated
    blurb: A chart, screenshot, or artifact with labels pointing straight at the meaning.
  field-guide:
    label: Field guide
    blurb: A naturalist plate cataloguing the "species" of a data/AI thing.
  comic:
    label: Comic
    blurb: Strips that teach a real lesson.
  poster:
    label: Poster
    blurb: One bold visual metaphor for a data/AI idea.
  typographic:
    label: Typographic
    blurb: Type IS the image - words as the whole composition.
  carousel:
    label: Carousel
    blurb: Multi-slide explainers for concepts that need pacing.
  zine:
    label: Zine
    blurb: An editorial spread or mini-page - print-craft applied to one idea.
  card:
    label: Card
    blurb: A compact shareable image with one sharp idea.
  cheatsheet:
    label: Cheatsheet
    blurb: One page, 80% of what matters - a topic distilled and designed to keep.
  ironic-graph:
    label: Ironic graph
    blurb: Charts that tell the truth by exaggerating it.
  illustration:
    label: Illustration
    blurb: Data and AI ideas as scenes and characters.
  logo:
    label: Logo
    blurb: Marks and identity for data/AI things.
  style-study:
    label: Style study
    blurb: The sketchbook - mimicking a beautiful style to learn it.
  website:
    label: Website
    blurb: A full web page or site design.
    scope: studio
  app-ui:
    label: App UI
    blurb: Application or product interface screens.
    scope: studio
  deck:
    label: Deck
    blurb: Slide or presentation design.
    scope: studio
  identity:
    label: Identity
    blurb: Logo and brand identity systems.
    scope: studio
  packaging:
    label: Packaging
    blurb: Physical product and package design.
    scope: studio
  motion:
    label: Motion
    blurb: Animation and motion design.
    scope: studio

# CATEGORY = the visual discipline/genre a style belongs to (MECE list, added 2026-09-02).
# Multi-tag like a Notion db: a style card carries EVERY category it genuinely serves
# (comic + storybook, ui-web + infographic, etc). Cards store it as `category: [a, b]`.
# One vocabulary, one home - this file. Do not fork or restate the list anywhere.
categories:
  # MECE since 2026-11-09: a card carries exactly ONE category. When a picture could fit two,
  # the first one in this list wins. Medium detail (oil, clay, film) lives in the card's DNA.
  dashboard:
    label: Dashboard design
    blurb: Complex, production-ready professional data dashboards - many linked views, KPIs, filters, built to be used daily.
  data-viz:
    label: Data viz
    blurb: Simple data viz - a single chart, graph or data map; marks driven by values.
  infographic:
    label: Infographic
    blurb: Explainers that combine data, pictures and hand-set text on one page.
  story-comic:
    label: Story and comic
    blurb: Narrative pictures - storybook characters, scenes, comic panels and strips.
  photography:
    label: Photography
    blurb: Lens-based pictures and photo-art - light, grade, staged scenes, miniatures.
  three-d-material:
    label: 3D and material
    blurb: Rendered 3D, sculpture, objects and physical craft - clay, textile, glass, paper.
  graphic-type:
    label: Graphic and type design
    blurb: Posters, layout, lettering, marks and identity - design carried by shape and type.
  ui-web:
    label: UI / Web
    blurb: Website, app and product interface screens (dashboards have their own category).
  illustration-painting:
    label: Illustration and painting
    blurb: Drawn or painted images - editorial illustration and fine-art traditions such as ink, oil and engraving.

# AUDIENCE (stored as `register:`) = where the visual is seen. Revised 2026-11-09 by Phoebe
# ("current 3 does not make sense"): the old board/bold/creative mixed an audience with a loudness
# level. A card carries exactly ONE. Every visual skill picks styles by this.
registers:
  boardroom:
    label: Boardroom
    blurb: Board, C-level, investors and client decision-makers. Board packs, proposals, governance. Calm, exact, credible.
  stage:
    label: Stage
    blurb: Keynotes, conferences, launches and all-hands. One big idea that reads from the back row.
  feed:
    label: Feed
    blurb: LinkedIn and social followers scrolling past. Stops the scroll in a second; personal-brand posts.
  classroom:
    label: Classroom
    blurb: Courses, workshops, training and handouts. Explains clearly and stays friendly.
  team:
    label: Team
    blurb: Your own colleagues - culture, recognition, onboarding, farewells. Warm and about belonging.
  gallery:
    label: Gallery
    blurb: Art viewers and reflective essays. Slow, contemplative, art first.
