title: The price of a word
date: 2026-09-11
tool: html-render
format: chart
topic: [contrarian, ai strategy, leadership, market signals, ai washing, hype, measurement, dot-com]
style: victorian atlas revival
prompt: "DESIGN-BUILT (not prompted) - hand-authored HTML + inline SVG, geometry computed and asserted in build.py, rendered headless Chrome at 1000x1250 CSS px with --force-device-scale-factor=2 (2000x2500, 4:5).\nSTYLE: SV-052 Victorian Atlas Revival, FIRST outing - engraved hatching fills, aged paper ground, serif smallcaps labels, ornamental plate furniture. Light ground only. Two muted plate colours, no flat modern colour block.\nMARKS: one bordered plate = one measured event; block HEIGHT = the published cumulative abnormal return on a shared 0-80 per-cent scale, so Plates I and II are comparable by eye; block WIDTH = the published event window on each plate's own day axis; hatch DIRECTION = the direction of the name change, leaning right for a word added and left for a word removed; the dashed vertical rule at day 0 = the announcement, the only thing that changed; the DASHED TOP EDGE of every block = a published endpoint, never a path.\nCOLOUR: madder = a published cumulative abnormal return, stamped twice and nowhere else. Indigo = a count of the word being said, not a payment. All structure - rules, ticks, borders, hatch geometry - is iron-gall ink and carries no data meaning. Plate III deliberately carries no madder because the 2016-2024 study reports direction, not a published return.\nTYPE: Bodoni Moda wears the era (cartouche, plate titles, stamped values); EB Garamond with oldstyle figures carries every label, note and source.\nMESSAGE: the market has never required the thing. It prices the sentence."
takeaway: "In 1998-99, 95 firms added '.com' to their names and earned a cumulative abnormal return of about 74 per cent over the 10 days around the announcement - and the effect was the same for firms whose core business had nothing to do with the internet. After the crash, 67 firms removed '.com' and earned about 64 per cent over 60 days. Same word, opposite actions, both paid. The instrument is running again: the share of US public firms saying 'AI' on the earnings call went from roughly zero in 2016 to about 20 per cent by mid-2024, and in that data the thing that predicted real AI output was who a firm hired, not what it said. Ask which one your roadmap is buying."
concept: "Three plates from a statistical atlas that does not exist. Adding a word paid 74 per cent. Removing the same word paid 64 per cent. A third plate shows the same instrument running on a new word, and carries no accent at all, because the receipts are not in yet."
inspired_by: "WL-096 (reservoir) promoted as IK-19 · Cooper, Dimitrov & Rau (J.Finance 2001) and Cooper, Khorana, Osobov, Patel & Rau (J.Corp.Fin 2004) read from the published PDFs · B. Li, 'AI Washing' (Univ. of Florida, Aug 2025) · SV-052 Victorian Atlas Revival style DNA, first outing · taste drip: Fonts In Use, one face wears the era and a quieter one carries the data"
