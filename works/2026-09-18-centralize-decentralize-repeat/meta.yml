title: Centralize. Decentralize. Repeat.
date: 2026-09-18
tool: html-render
format: timeline
topic: [leadership, contrarian, data teams, org design, data architecture, data mesh, data warehouse, data lake, governance]
style: narrative stream
prompt: "DESIGN-BUILT (not prompted) - hand-authored HTML + generated inline SVG, all geometry computed and asserted in build.py, rendered headless Chrome at 1000x1250 CSS px with --force-device-scale-factor=2 (2000x2500, 4:5).\nSTYLE: SV-047 Narrative Stream, FIRST outing - one continuous stream as the spine of the argument, annotations placed inside the flow with hairline leaders, one saturated accent per category, muted editorial ground. Light ground only.\nMARKS: x = time on a TRUE LINEAR scale, 1960-2026, no compression anywhere; y = where ownership of the data sits, top rail = one central team, bottom rail = the domains; the ribbon = the industry's default answer, ONE unbroken band; ribbon HUE = which half of the axis the band is in, changing at the midline and nowhere else; ribbon THICKNESS is constant and carries no meaning, asserted equal at every one of the 811 samples; the pale dashed tail after 2022 = not yet history, and it carries no arrowhead because nothing here predicts the next turn.\nCOLOUR: deep teal = the centralised regime. Saturated rose = the domain-owned regime. Those two hues appear nowhere else on the sheet. All structure - rails, ticks, leaders, axis, the dashed 2024 rule - is warm grey and carries no data meaning.\nTYPE: Fraunces wears the argument (title, the takeaway, the McGregor line); Inter carries every label; IBM Plex Mono carries every year and source.\nLAYOUT: all eight annotations are placed by a collision solver that tries slots nearest each node first and asserts, before writing the file, that no two label boxes overlap, that none crosses the ribbon in its own x-range, and that none leaves the plate.\nMESSAGE: the swing is older than the technology, so the turn you are living through is a phase, not a decision."
takeaway: "The data organisation has been swinging between one central team and domain ownership since before data teams existed - the glass house, the spreadsheet, the enterprise warehouse, the data lake, the cloud warehouse, the data mesh, and now the central platform with federated governance. Douglas McGregor described the cycle in 1960 and called it the accordion effect; he was writing about factories. On this sheet the default answer reverses six times, and the turns keep getting closer: 15 years from the glass house to the spreadsheet, 4 from the cloud warehouse to the data mesh. So the useful question is not centralize or decentralize. It is: which half of the swing was I hired into, what did the last one break, and what survives the next turn?"
concept: "Sixty-six years of the centralize/decentralize cycle drawn as one unbroken ribbon on a true linear time axis, where vertical position is the only encoded variable and every turn is a dated, sourced event. A list of eras is a slide; the same eras given a shape are an argument - you can see the wave, and you can see it accelerating."
inspired_by: "WL-077 (reservoir) promoted as IK-20 · Douglas McGregor, The Human Side of Enterprise (1960) - the accordion effect, found while verifying that the pendulum is a named pattern and not a LinkedIn observation · SV-047 Narrative Stream style DNA, first outing, decoded from The Pudding's 'Is the Love Song Dying?' · taste drip: the Pudding move of putting every annotation inside the flow and letting a legend die"
