title: 18% or 78%? One street, three rulers.
date: 2026-09-28
tool: html-render
format: diagram
topic: [ai adoption, applied ai, metrics, denominators, weighting, survey design, data decode, kpi]
style: ink sketch, one accent
prompt: "DESIGN-BUILT (not prompted) - hand-authored HTML + generated inline SVG, every count computed and asserted in build.py, rendered headless Chrome at 1000x1250 CSS px with --force-device-scale-factor=2 (2000x2500, 4:5).\nSTYLE: ink sketch, one accent - loose indigo line on warm paper, seeded wobble and corner overshoot for the hand, exactly ONE saturated hue on the sheet.\nMARKS: a drawn street of 10 firms and 152 workers (8 shops of 4, 2 towers of 60). Building size = headcount; each window is one worker. Amber = AI actually in use, and nothing else: a roof flag (the firm uses AI) or a lit window (this person uses AI). Six lit windows sit in unflagged shops - bring-your-own use the owner would not report. Below, three rulers count the same street: firms flagged 2/10 = 20%, workers under a flag 120/152 = 79% (indigo fill = counted because of the building, not their own use), lit windows 56/152 = 37%. Each ruler is paired with the real US figure it mirrors, stamped with source and month.\nTYPE: Fraunces for the argument and the numbers, Inter for labels, IBM Plex Mono for counts and sources.\nMESSAGE: the gap between AI adoption rates is mostly the unit - firm-weighted vs employment-weighted vs individual use - not a disagreement about reality."
takeaway: "In the same autumn the US AI adoption rate was 18 per cent (share of firms, Census BTOS, Dec 2025), 41 per cent (share of workers using genAI for work, Real-Time Population Survey, Nov 2025) and 78 per cent (share of the workforce at a firm that has adopted AI, Atlanta Fed SBU, Nov 2025). All three are right. Big firms adopt first and hold most of the workers, so counting firms gives a small number and counting workers under an adopting roof gives a big one. An adoption rate without its unit is not a number yet: say per firm, per worker, or per worker-at-a-firm, then the date."
concept: "The AI adoption rate drawn as one street measured with three honest rulers. Ten firms, 152 workers, two towers flying the flag. Count the firms and you get 20 per cent; count the workers under a flag and you get 79; count the lit windows and you get 37. The real US numbers for late 2025 fall in the same order - 18, 78, 41 - for the same reason."
inspired_by: "Phoebe's Wednesday Data Decode KPI repo (linkedin-wed-post-vault/Sources/kpi-repo.md), AI Adoption Rate decoded 2026-08-05, the gallery source lane per her 2026-09-22 steer - and Jeffrey S. Allen, 'Monitoring AI Adoption in the U.S. Economy', FEDS Notes, Federal Reserve Board, 3 April 2026"
featured: false
