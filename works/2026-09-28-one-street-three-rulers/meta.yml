prompt: "RASTER, generated with GPT Image via codex-cli (baoyu-image-gen), 2:3, fourth variant; every\
  \ word and number (about 77 words, all in-world) checked letter by letter at full resolution. Replaced\
  \ a more creative but less informative third variant on 2026-10-02 after Phoebe: \"at the end of the\
  \ day, its still inforgraphics, so dont miss the info part.\"\n\nA tall portrait storybook INFOGRAPHIC\
  \ illustration, hand-painted watercolour and gouache on warm paper, delicate ink outlines, rich warm\
  \ colours, full-bleed painted scene, premium picture-book craft for grown-ups. It must be both beautiful\
  \ and informative: the facts live on signs, plaques and banners inside the scene.\n\nSCENE: a cobbled\
  \ autumn high street at soft blue-hour twilight, curving gently uphill, lamps glowing. In the middle\
  \ distance stand two tall glass office towers, each flying a small orange flag; their many windows glow\
  \ with people working at screens. A brass plaque on the base of the towers reads exactly: \"BIG FIRMS,\
  \ 250+ STAFF: 37% USE AI\"\nAlong both sides are cosy small shops where people work by hand: a baker\
  \ kneading bread, a barber cutting hair, a bookseller, a florist, a bike mechanic, a tailor, a toymaker\
  \ - NO laptops or screens in these shops. A hanging wooden shop sign over the street reads exactly:\
  \ \"SMALL SHOPS, 1-4 STAFF: UNDER 20% USE AI\"\nOnly ONE small cafe has a glowing window where the owner\
  \ works on a laptop; a chalkboard outside the cafe reads exactly: \"OWNER SAYS: NO AI HERE\"\n\nFOREGROUND:\
  \ three friendly surveyors in waistcoats, each beside a large painted wooden signpost. Each signpost\
  \ has four lines exactly as written:\n1. Left - a surveyor with a clipboard and a hand tally clicker\
  \ counts shop doors. Signpost:\n   \"COUNT THE FIRMS\" / \"18%\" / \"every door counts once\" / \"Census,\
  \ Dec 2025\"\n2. Centre - a surveyor pulls an enormous yellow measuring tape wrapped around both towers.\
  \ Signpost:\n   \"COUNT EVERYONE UNDER A FLAG\" / \"78%\" / \"users or not\" / \"Atlanta Fed, Nov 2025\"\
  \n3. Right - a surveyor on a wooden ladder holds a lantern up to the cafe window. Signpost:\n   \"COUNT\
  \ WHO USES IT\" / \"41%\" / \"cafe included\" / \"Worker survey, Nov 2025\"\nThe percentages are the\
  \ largest text on each signpost.\n\nTOP: a painted ribbon banner across the sky reading exactly \"18%\
  \ OR 78%?\" and beneath it in smaller hand lettering exactly \"Same street. Same autumn. Three honest\
  \ rulers.\"\nBOTTOM: a curling paper scroll across the cobbles reading exactly \"No unit, no number.\"\
  \ and beneath it smaller: \"Say per firm, per worker, or per worker-at-a-firm.\"\n\nAll lettering is\
  \ clean, correctly spelled English, hand-painted and legible. No other text anywhere. No robots, no\
  \ glowing brains, no circuit boards, no logos, no watermark, no dark background, no photorealism."
takeaway: 'In the same autumn the US AI adoption rate was 18 per cent (share of firms, Census BTOS, Dec
  2025), 41 per cent (share of workers using genAI for work, Real-Time Population Survey, Nov 2025) and
  78 per cent (share of the workforce at a firm that has adopted AI, Atlanta Fed SBU, Nov 2025). All three
  are right. Big firms adopt first and hold most of the workers, so counting firms gives a small number
  and counting everyone under an adopting roof gives a big one. An adoption rate without its unit is not
  a number yet: say per firm, per worker, or per worker-at-a-firm, then the date.'
concept: The AI adoption rate painted as one autumn high street measured by three surveyors. One counts
  shop doors with a clicker, one wraps a tape round the two flagged towers and takes in everyone inside,
  one climbs a ladder with a lantern to see who is actually using it - including the one cafe owner at
  a laptop in a street of bakers, barbers and tailors working by hand. Three honest rulers, three honest
  numbers.
