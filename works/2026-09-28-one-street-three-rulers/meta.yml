  2. Centre: a surveyor pulls an enormous yellow measuring tape wrapped around both tall towers, sweeping
  in every window lit or dark. His signpost reads exactly: "COUNT EVERYONE UNDER A FLAG 78%"

  3. Right: a surveyor on a tall wooden ladder holds up a lantern and peers into the glowing windows one
  at a time, including the lit window of a small shop. Her signpost reads exactly: "COUNT WHO USES IT
  41%"


  TOP: a painted ribbon banner across the sky reading exactly: "18% OR 78%?" and beneath it in smaller
  hand lettering exactly: "Same street. Same autumn. Three honest rulers."

  BOTTOM: a curling paper scroll across the cobbles reading exactly: "No unit, no number."


  All lettering is clean, correctly spelled English, hand-painted, large and legible. No other text anywhere.
