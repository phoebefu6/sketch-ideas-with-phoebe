  SCENE: a cobbled high street at soft blue-hour twilight seen straight on, like a stage set, the street
  curving gently uphill. Along it stand eight small cosy shops (a bakery, a barber, a bookshop, a florist,
  a bike repair shop, a tailor, a cafe, a toy shop) and two tall office towers. ONLY the two towers fly
