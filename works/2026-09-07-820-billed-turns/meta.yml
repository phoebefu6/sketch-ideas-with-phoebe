title: You sent 40 turns. The API billed 820.
date: 2026-09-07
tool: html-render
format: data-portrait
topic: [foundations, llm, tokens, context window, api cost, applied ai, prompt caching]
style: two-color acid
prompt: "DESIGN-BUILT (not prompted) - hand-authored HTML/CSS + generated inline SVG, rendered headless Chrome at 1000x1250 CSS px with --force-device-scale-factor=2 (4:5).\nSTYLE: SV-034 Two-Color Acid, second outing - EXACTLY two colours, acid lime #D2FF00 on near-black #111112. No white, no grey, no third hue, no gradients, no mid-tones.\nMARKS: one small square = one turn's tokens sitting on the wire inside one request, billed as input (all 820 drawn, never symbolised); one row = one API request, and its WIDTH is everything that request had to carry; the solid left column = turn 1, written once and re-billed in all 40 requests; the diagonal edge = the only genuinely new text, 40 blocks of 820; the triangle's area = the bill.\nHIERARCHY: weight inside the one accent - hairline square = billed again, solid square = the same message billed again. The palette allows no third colour, so nothing is dimmed.\nTYPE: Archivo 800 for the title and the hero count, IBM Plex Mono for every spec label, annotation and source line.\nMESSAGE: the chat has 40 turns; the invoice has 820. The shape of a stateless conversation is a triangle."
takeaway: "The Messages API is stateless - nothing is remembered, so every turn re-sends the whole conversation as input tokens. Forty requests therefore bill T(40) = 820 turn-blocks, 20.5x what per-turn math predicts, and your first message is billed all 40 times. Only the diagonal is new. Caching re-prices the replay at 0.1x; it does not stop it - cap the history and summarise old turns."
concept: "A 40-turn conversation drawn as the bill instead of the chat: a lower-triangular matrix of 820 hand-placed squares where each row is one API request and its width is the entire history that request had to carry. The left column is solid - one message, sent once, billed forty times."
inspired_by: "WL-001 (reservoir) promoted as IK-18 · WOW-TRACKER taste rule 4, which names this row as the example of the dramatic number a data-portrait needs · mechanism verified against platform.claude.com/docs (Messages API statelessness, Opus 5 pricing and prompt-caching multipliers) · SV-034 Two-Color Acid style DNA"
