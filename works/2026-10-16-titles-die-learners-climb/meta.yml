  A hand-painted 19th-century alpine panorama illustration, like an antique tourist relief panorama map,
  of an adventure game world with no visible end.


  COMPOSITION, left to right:

  - LEFT: one large mountain filling the left 40 percent of the frame, its broad face crossed by a clear
