  - FAR RIGHT: a third mountain almost entirely veiled in thick drifting fog, only faintly visible, with
  three small mysterious stone doorways carved into its rock, each sealed by a plain door with a padlock,
  softly glowing at the edges like unexplored rooms in a puzzle game.

  - Faint dotted footpaths branch off into the fog in several directions, leading nowhere visible.


