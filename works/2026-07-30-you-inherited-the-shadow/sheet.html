<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>You approved the number. You inherited the shadow.</title>
<style>
  :root {
    --ink: #0c0b10;
    --charcoal: #17141d;
    --graphite: #2c2832;
    --silver: #d7d2d9;
    --violet: #a77cff;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    width: 1600px;
    height: 2000px;
    overflow: hidden;
    background: var(--ink);
  }
  body {
    font-family: "Avenir Next", "Helvetica Neue", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  svg { display: block; width: 1600px; height: 2000px; }
</style>
</head>
<body>
<svg viewBox="0 0 1600 2000" role="img" aria-labelledby="poster-title poster-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="poster-title">You approved the number. You inherited the shadow.</title>
  <desc id="poster-desc">A freestanding 4.23 million dollar forecast casts a widening prediction-interval shadow along a quarterly planning grid. A violet commitment flag stands at the broad, uncertain end.</desc>

  <defs>
    <linearGradient id="surface" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#25212a"/>
      <stop offset="0.5" stop-color="#17141d"/>
      <stop offset="1" stop-color="#0d0c11"/>
    </linearGradient>
    <linearGradient id="lightFalloff" x1="0.08" y1="0.96" x2="0.8" y2="0.16">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".15"/>
      <stop offset=".42" stop-color="#ffffff" stop-opacity=".04"/>
      <stop offset="1" stop-color="#000000" stop-opacity=".2"/>
    </linearGradient>
    <linearGradient id="fanDepth" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#020204" stop-opacity=".9"/>
      <stop offset=".28" stop-color="#030205" stop-opacity=".78"/>
      <stop offset=".7" stop-color="#050408" stop-opacity=".58"/>
      <stop offset="1" stop-color="#07060a" stop-opacity=".22"/>
    </linearGradient>
    <linearGradient id="metalFace" x1="0" y1="0" x2=".8" y2="1">
      <stop offset="0" stop-color="#f2eef3"/>
      <stop offset=".22" stop-color="#d4cfd6"/>
      <stop offset=".58" stop-color="#8f8993"/>
      <stop offset="1" stop-color="#4f4a54"/>
    </linearGradient>
    <linearGradient id="metalEdge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#67616b"/>
      <stop offset=".52" stop-color="#242129"/>
      <stop offset="1" stop-color="#0c0b0f"/>
    </linearGradient>
    <filter id="grain" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency=".78" numOctaves="3" seed="27" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="mono"/>
      <feComponentTransfer in="mono" result="softNoise">
        <feFuncA type="table" tableValues="0 .13"/>
      </feComponentTransfer>
      <feBlend in="SourceGraphic" in2="softNoise" mode="soft-light"/>
    </filter>
    <filter id="softFan" x="-15%" y="-15%" width="130%" height="130%">
      <feGaussianBlur stdDeviation="15"/>
    </filter>
    <filter id="farSoft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="34"/>
    </filter>
    <filter id="objectShadow" x="-30%" y="-30%" width="180%" height="190%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <filter id="flagGlow" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <clipPath id="planeClip">
      <path d="M190 196 L1410 196 L1540 1774 L60 1774 Z"/>
    </clipPath>
    <clipPath id="fanClip">
      <path d="M507 1455 C535 1340 560 1220 610 1092 C720 830 860 610 1000 345 L1535 345 C1250 705 1060 950 920 1175 C840 1315 786 1422 748 1500 Z"/>
    </clipPath>
  </defs>

  <rect width="1600" height="2000" fill="#09080c"/>

  <!-- The ruled planning surface - a dark physical plane under one hard light. -->
  <path d="M190 196 L1410 196 L1540 1774 L60 1774 Z" fill="url(#surface)"/>
  <path d="M190 196 L1410 196 L1540 1774 L60 1774 Z" fill="url(#lightFalloff)" filter="url(#grain)"/>

  <g clip-path="url(#planeClip)" fill="none" stroke="#77717d" stroke-opacity=".22" stroke-width="2">
    <path d="M128 1510 L1485 1510"/>
    <path d="M143 1308 L1467 1308"/>
    <path d="M158 1106 L1450 1106"/>
    <path d="M173 904 L1434 904"/>
    <path d="M185 702 L1418 702"/>
    <path d="M196 500 L1402 500"/>
    <path d="M205 298 L1387 298"/>
    <path d="M366 194 L283 1774"/>
    <path d="M570 194 L529 1774"/>
    <path d="M800 194 L800 1774"/>
    <path d="M1030 194 L1071 1774"/>
    <path d="M1234 194 L1317 1774"/>
  </g>

  <!-- Quarter labels recede away from the viewer. -->
  <g fill="#a39ca8" font-size="22" font-weight="550" letter-spacing="5" opacity=".72">
    <text x="90" y="1498">Q1</text>
    <text x="112" y="1296">Q2</text>
    <text x="134" y="1094">Q3</text>
    <text x="155" y="892">Q4</text>
    <text x="175" y="690">Q5</text>
    <text x="191" y="488">Q6</text>
  </g>
  <text x="225" y="257" fill="#a39ca8" font-size="19" font-weight="550" letter-spacing="5" opacity=".58">FORECAST HORIZON</text>

  <!-- The interval shadow - measured by the grid, wider and softer with horizon. -->
  <path d="M510 1450 C540 1320 585 1180 650 1040 C770 790 900 590 980 335 L1545 335 C1250 700 1050 970 920 1190 C838 1330 790 1435 748 1500 Z"
        fill="#000000" opacity=".22" filter="url(#farSoft)"/>
  <g clip-path="url(#fanClip)">
    <rect x="430" y="290" width="1110" height="1250" fill="url(#fanDepth)" filter="url(#softFan)"/>
    <path d="M520 1452 C570 1265 645 1088 742 914 C850 720 940 548 1050 340 L1425 340 C1160 650 970 910 850 1160 C784 1297 748 1400 720 1490 Z"
          fill="#010103" opacity=".48" filter="url(#softFan)"/>
    <path d="M540 1455 C590 1272 660 1095 750 930 C838 770 910 620 995 470 L1270 390 C1040 695 900 926 820 1152 C772 1285 744 1397 726 1490 Z"
          fill="#000000" opacity=".52" filter="url(#softFan)"/>
    <g stroke="#b1aab5" stroke-opacity=".18" stroke-width="2">
      <path d="M486 1510 L1510 1510"/>
      <path d="M500 1308 L1490 1308"/>
      <path d="M530 1106 L1470 1106"/>
      <path d="M590 904 L1455 904"/>
      <path d="M680 702 L1435 702"/>
      <path d="M850 500 L1420 500"/>
    </g>
  </g>

  <!-- The business commitment sits in the part nobody printed. -->
  <circle cx="1290" cy="482" r="36" fill="#a77cff" opacity=".13" filter="url(#flagGlow)"/>
  <g>
    <line x1="1290" y1="480" x2="1290" y2="392" stroke="#a77cff" stroke-width="6"/>
    <path d="M1290 394 L1360 414 L1290 438 Z" fill="#a77cff"/>
    <ellipse cx="1290" cy="482" rx="21" ry="8" fill="#a77cff"/>
    <text x="1314" y="373" fill="#a77cff" font-size="17" font-weight="700" letter-spacing="3.5">COMMITTED</text>
  </g>

  <!-- Small crisp point estimate - extruded metal, the apparent deliverable. -->
  <ellipse cx="622" cy="1515" rx="260" ry="55" fill="#000000" opacity=".72" filter="url(#objectShadow)"/>
  <g transform="translate(365 1452) skewX(-8)">
    <text x="20" y="42" fill="url(#metalEdge)" stroke="#111016" stroke-width="8"
          font-size="185" font-weight="750" letter-spacing="-8">$4.23M</text>
    <text x="0" y="18" fill="url(#metalFace)" stroke="#e8e4ea" stroke-opacity=".38" stroke-width="2"
          font-size="185" font-weight="750" letter-spacing="-8">$4.23M</text>
    <path d="M18 43 L486 43" stroke="#09080c" stroke-width="8" opacity=".75"/>
  </g>
  <text x="368" y="1588" fill="#d1cbd4" font-size="20" font-weight="650" letter-spacing="4" opacity=".8">POINT ESTIMATE</text>

  <!-- Editorial caption - small enough to let the evidence photo lead. -->
  <line x1="96" y1="1840" x2="1504" y2="1840" stroke="#a77cff" stroke-width="2"/>
  <text x="96" y="1902" fill="#efebf0" font-size="32" font-weight="600" letter-spacing=".1">
    YOU APPROVED THE NUMBER. YOU INHERITED THE SHADOW.
  </text>
  <text x="1504" y="1950" text-anchor="end" fill="#a77cff" font-size="19" font-weight="650" letter-spacing="3.5">
    APPROVE THE RANGE - THE LAMP IS A CHOICE.
  </text>
</svg>
</body>
</html>
