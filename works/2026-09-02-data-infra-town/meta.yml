prompt: "GENERATED via baoyu-infographic (isometric-map layout x craft-handmade/hand-drawn-edu blend), backend codex-imagegen. Full reproducible prompts in prompts/ (v2 shipped; v1 kept - labels clipped by the 1.35:1 side-crop).\nONE TOWN, FIVE ARCHITECTURES, names taken literally: DATA LAKE = pond with raw mismatched objects afloat (file, photo, scroll, music note); DATA WAREHOUSE = big tidy building, identical boxes on shelves; DATA MART = small corner shop beside it, one team's curated boxes; DATA LAKEHOUSE = house on stilts standing in the lake, tidy shelves inside; DATA MESH = four garden plots, each with its own well and owner, joined by pipes.\nPALETTE: macaron pastels on cream, wobble outlines, doodle stars - style traits lifted from Phoebe's pasted reference flowchart.\nMESSAGE: spatial relationships carry the semantics - adjacency, size and ownership are the actual differences between the five architectures."
takeaway: "Lake stores raw, warehouse stores structured, mart serves one team, lakehouse puts warehouse comfort on raw storage, mesh splits ownership across domains. The names were the map all along - the real architecture question is who owns the water quality."
concept: "The five data architectures drawn as the literal town their names describe, so the geography teaches the differences: what each stores, how structured it is, and who owns it - visible in one look, no definitions required."
